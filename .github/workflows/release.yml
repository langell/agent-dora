# Publishes to npm when a version tag is pushed (npm version patch && git push --follow-tags).
# Uses npm trusted publishing (OIDC), so no npm token is stored anywhere.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # move the v0 tag
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm publish

      - name: Move the major version tag for Action users
        run: |
          major="$(echo "$GITHUB_REF_NAME" | cut -d. -f1)"
          git tag -f "$major"
          git push -f origin "$major"
