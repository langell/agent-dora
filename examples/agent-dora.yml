# Nightly metrics, published to GitHub Pages.
# Enable Pages first: Settings -> Pages -> Source: GitHub Actions.
name: agent-dora

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  deployments: read # lead time to production, from GitHub Deployments (Vercel, Netlify...)
  pages: write
  id-token: write

concurrency:
  group: agent-dora
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # durability needs full history

      - uses: langell/agent-dora@v0
        id: dora
        # Optional integrations: each is used when its secret is set.
        with:
          anthropic-admin-key: ${{ secrets.ANTHROPIC_ADMIN_KEY }} # AI cost per durable change
          linear-api-key: ${{ secrets.LINEAR_API_KEY }} # incidents
          pagerduty-token: ${{ secrets.PAGERDUTY_TOKEN }} # incidents

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dora.outputs.report-dir }}

      - uses: actions/deploy-pages@v4
        id: deploy
